<svg xmlns="http://www.w3.org/2000/svg" width="540" height="380" viewBox="0 0 540 380">
  <rect width="540" height="380" fill="#fafafa"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <text x="270" y="54" text-anchor="middle" font-size="19" font-weight="500" fill="#34363b">拖入 Applications 安装</text>
    <path d="M225 150h90m-12-12 12 12-12 12" stroke="#a3a5aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M45 224h450" stroke="#e6e6e8"/>
    <text x="225" y="270" font-size="12" fill="#62656c">首次启动被 macOS 拦截？</text>
    <text x="225" y="293" font-size="11" fill="#8b8e94">安装后，可双击左侧辅助脚本。</text>
    <text x="225" y="312" font-size="10" fill="#a1a3a8">仅移除 Audio QC 的下载隔离标记。</text>
    <text x="270" y="359" text-anchor="middle" font-size="10" fill="#a1a3a8">脚本若也被拦截，请参阅下载页的手动操作说明。</text>
