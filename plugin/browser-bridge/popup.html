<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>GA 浏览器连接</title>
<style>
*{box-sizing:border-box}body{width:360px;margin:0;padding:22px;font:13px/1.5 system-ui,-apple-system,sans-serif;color:#171d27;background:#fff}header{display:flex;align-items:center;gap:14px}.icon{display:grid;place-items:center;width:52px;height:52px;background:#f5f6f8;border-radius:14px;color:#68717d;flex-shrink:0}svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}h1{font-size:18px;font-weight:650;letter-spacing:-.5px;margin:0 0 6px}.state{display:flex;gap:8px;align-items:center;color:#727b87;font-size:12px}#dot{width:8px;height:8px;border-radius:50%;background:#a5acb6}.menu{position:relative;margin-left:auto;align-self:flex-start}button{font:inherit;cursor:pointer}.more{border:0;background:none;color:#7b8490;padding:2px 0 5px 8px;font-size:20px;line-height:1}#actions{position:absolute;right:0;top:28px;min-width:150px;z-index:2;background:#fff;border:1px solid #e6e8ec;border-radius:10px;box-shadow:0 6px 22px #1112;padding:5px}#actions button,#actions a{display:block;width:100%;padding:8px;border:0;background:none;text-align:left;color:#4c5664;font-size:12px;text-decoration:none;border-radius:6px;white-space:nowrap}#actions button:hover,#actions a:hover{background:#f4f5f7}.endpoint{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f7f8fa;border-radius:12px;margin:24px 0 18px;padding:16px}.caption{font-size:11px;color:#818995;margin-bottom:5px}code{font:15px ui-monospace,SFMono-Regular,monospace;color:#252c37}.copy{width:34px;height:34px;display:grid;place-items:center;border:1px solid #eef0f3;border-radius:9px;background:#fff;color:#727b87;box-shadow:0 2px 8px #11104}.copy svg{width:17px;height:17px}.toggle-row{border-top:1px solid #eceef1;padding-top:19px;display:flex;justify-content:space-between;align-items:center;font-size:14px}.switch{position:relative;width:44px;height:25px;border:0;border-radius:20px;background:#c7cdd4;transition:background .15s}.switch[aria-checked=true]{background:#176bfa}.switch::after{content:'';position:absolute;left:3px;top:3px;width:19px;height:19px;background:white;border-radius:50%;box-shadow:0 1px 3px #0002;transition:transform .15s}.switch[aria-checked=true]::after{transform:translateX(19px)}button:focus-visible,a:focus-visible{outline:2px solid #176bfa;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}#hint{font-size:11px;color:#8a939f;margin:14px 0 0;line-height:1.6}#hint:empty{display:none}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="icon"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6m-3-4v4"/></svg></div><div><h1>GA 浏览器连接</h1><div class="state" role="status"><span id="dot"></span><span id="state">正在检查连接</span></div></div><div class="menu"><button id="more" class="more" aria-label="更多操作" aria-expanded="false">⋮</button><div id="actions" hidden><button id="refresh">刷新连接状态</button><a href="https://github.com/lsdefine/GenericAgent" target="_blank" rel="noreferrer">GenericAgent · MIT ↗</a></div></div></header>
<div class="endpoint"><div><div class="caption">本机桥接</div><code>127.0.0.1:18765</code></div><button id="copy" class="copy" title="复制地址" aria-label="复制本机桥接地址"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button></div>
<div class="toggle-row"><span id="toggle-label">启用桥接</span><button id="toggle" class="switch" role="switch" aria-labelledby="toggle-label" aria-checked="false" disabled></button></div><p id="hint" role="status"></p>
<script src="popup.js"></script></body></html>
